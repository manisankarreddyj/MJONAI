name: deterministic-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  architecture-rules:
    name: Architecture rules (ADR-0008)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full requirements
        run: python -m pip install --quiet -r requirements.txt pytest
      - name: Enforce dependency graph rules
        run: python -m pytest tests/test_architecture_rules.py -v

  schema-drift:
    name: Schema drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --quiet pytest
      - name: Verify DDL matches writer payloads
        run: python -m pytest tests/test_schema_drift.py -v

  non-network-subset:
    name: Non-network test subset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full requirements
        run: python -m pip install --quiet -r requirements.txt pytest
      - name: Run deterministic (non-network) tests
        run: python -m pytest tests --ignore=tests/research -m "not network and not flaky" -q
      - name: Validate research suite is gated (collected + skipped)
        run: |
          out=$(python -m pytest tests/research -q 2>&1)
          echo "$out" | grep -q "skipped" && echo "GATE OK: research skipped without --run-research" || (echo "GATE FAILED"; exit 1)

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml