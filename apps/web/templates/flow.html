<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>MJONAI · Flow builder</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/vendor/reactflow.base.css">
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#0d1117; color:#e6edf3; }
  header { display:flex; align-items:baseline; gap:.8rem; padding:.8rem 1rem;
           border-bottom:1px solid #21262d; flex-wrap:wrap; }
  h1 { font-size:1.05rem; margin:0; }
  a { color:#8b949e; text-decoration:none; }
  a:hover { color:#e6edf3; }
  .warn { color:#d29922; font-size:.78rem; padding:.6rem 1rem 0; margin:0; max-width:1100px; }
  .palette { display:flex; gap:.4rem; padding:.5rem 1rem; flex-wrap:wrap; align-items:center;
             border-bottom:1px solid #21262d; }
  .palette span { color:#8b949e; font-size:.72rem; margin-right:.2rem; }
  button { background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:6px;
           padding:.28rem .6rem; font:inherit; font-size:.78rem; cursor:pointer; }
  button:hover { border-color:#8b949e; }
  #flow { width:100vw; height:calc(100vh - 132px); }
  .node { background:#161b22; border:1px solid #30363d; border-radius:10px;
          padding:.5rem .7rem; font-size:.78rem; width:186px; }
  .node .t { font-weight:700; font-size:.8rem; margin-bottom:.15rem; }
  .node .s { color:#8b949e; font-size:.72rem; line-height:1.35; }
  .node.det  { border-color:#1f4b8f; } .node.det  .t { color:#60a5fa; }
  .node.risk { border-color:#8c2b26; } .node.risk .t { color:#f85149; }
  .node.ai   { border-color:#6b4e0c; } .node.ai   .t { color:#d29922; }
  .node.exec { border-color:#1a5e36; } .node.exec .t { color:#3fb950; }
  .node.learn{ border-color:#4c3a86; } .node.learn.t { color:#a78bfa; }
  .node.learn .t { color:#a78bfa; }
  .node.out  { border-color:#30363d; }
  .react-flow__edge-path { stroke:#484f58; }
  .react-flow__controls { background:#161b22; border:1px solid #30363d; }
  .react-flow__controls button { background:#161b22; border-bottom:1px solid #30363d; color:#e6edf3; }
</style>
</head>
<body>
<header>
  <h1>Flow builder</h1>
  <a href="/flow">static pipeline view</a>
  <a href="/">← dashboard</a>
</header>
<p class="warn">ADVISORY BUILDER — compose a research flow (data → condition → alert) and export it as JSON.
  Nothing here is wired to execution: the app cannot place orders (ADR-0007), and a composed flow is saved
  as a research artefact only.</p>
<div class="palette">
  <span>Add node:</span>
  <button onclick="addNode('market')">Market data</button>
  <button onclick="addNode('indicator')">Indicator</button>
  <button onclick="addNode('condition')">Condition</button>
  <button onclick="addNode('alert')">Alert</button>
  <button onclick="addNode('note')">Note</button>
  <span style="margin-left:1rem"></span>
  <button onclick="loadTemplate()">Template: FVG gap-hold</button>
  <button onclick="exportGraph()">Export JSON</button>
  <button onclick="clearGraph()">Clear</button>
</div>
<main><div id="flow"></div></main>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/reactflow.umd.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const {
  React: R, ReactDOM: RD, default: RF,
  Background, Controls, MiniMap, Handle, Position, addEdge, applyNodeChanges, applyEdgeChanges,
} = window;

let idSeq = 1;
const nextId = (p) => `${p}-${idSeq++}`;
const KINDS = {
  market:    { cls: "det",   t: "Market data", s: "symbol / timeframe / source (warehouse)" },
  indicator: { cls: "det",   t: "Indicator",   s: "from the registry indicator library" },
  condition: { cls: "risk",  t: "Condition",   s: "threshold / structure test (causal)" },
  alert:     { cls: "exec",  t: "Alert",       s: "Telegram / Discord notification" },
  note:      { cls: "learn", t: "Note",        s: "research note — no execution" },
};
function makeNode(kind, x, y) {
  const k = KINDS[kind] || KINDS.note;
  return { id: nextId(kind), type: "default", position: { x, y }, data: { kind, ...k } };
}
function template() {
  const a = makeNode("market", 40, 120), b = makeNode("indicator", 300, 120),
        c = makeNode("condition", 560, 120), d = makeNode("alert", 820, 120);
  return {
    nodes: [a, b, c, d],
    edges: [{ id: `e-${a.id}-${b.id}`, source: a.id, target: b.id },
            { id: `e-${b.id}-${c.id}`, source: b.id, target: c.id },
            { id: `e-${c.id}-${d.id}`, source: c.id, target: d.id }],
  };
}

function Node({ data }) {
  return R.createElement("div", { className: `node ${data.cls}` },
    R.createElement("div", { className: "t" }, data.t),
    R.createElement("div", { className: "s" }, data.s),
    R.createElement(Handle, { type: "target", position: Position.Left }),
    R.createElement(Handle, { type: "source", position: Position.Right }),
  );
}
const nodeTypes = { default: Node };

let external = null;   // { addNode, template, clear, export } set by the component
function Flow() {
  const t = template();
  const [ns, setNs] = R.useState(t.nodes);
  const [es, setEs] = R.useState(t.edges);
  const onNodesChange = R.useCallback((ch) => setNs((p) => applyNodeChanges(ch, p)), []);
  const onEdgesChange = R.useCallback((ch) => setEs((p) => applyEdgeChanges(ch, p)), []);
  const onConnect = R.useCallback((c) => setEs((p) => addEdge({ ...c, animated: false }, p)), []);
  external = R.useMemo(() => ({
    add: (kind) => { const n = makeNode(kind, 60 + Math.random() * 500, 80 + Math.random() * 300);
                     setNs((p) => [...p, n]); return n; },
    tpl: () => { const s = template(); setNs(s.nodes); setEs(s.edges); },
    clear: () => { setNs([]); setEs([]); },
    graph: () => ({ nodes: ns, edges: es }),
  }), [ns, es]);
  return R.createElement(RF, { nodes: ns, edges: es, nodeTypes, onNodesChange, onEdgesChange, onConnect,
    fitView: true, minZoom: 0.2, maxZoom: 1.8 },
    R.createElement(Background, { variant: "lines", color: "#21262d", gap: 22 }),
    R.createElement(MiniMap, { pannable: true, zoomable: true, maskColor: "rgba(13,17,23,.7)",
      nodeColor: () => "#30363d", style: { background: "#0d1117" } }),
    R.createElement(Controls, { showInteractive: false }),
  );
}
RD.render(R.createElement(Flow), $("flow"));

function addNode(kind) { external && external.add(kind); }
function loadTemplate() { external && external.tpl(); }
function clearGraph() { external && external.clear(); }
function exportGraph() {
  const g = external ? external.graph() : { nodes: [], edges: [] };
  const blob = new Blob([JSON.stringify({ schema: "mjonai.flow/1", ...g }, null, 2)],
                        { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mjonai-flow.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
