version: '3.8'

services:
  mjonai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mjonai_trading_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SYSTEM_MODE=RESEARCH
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
